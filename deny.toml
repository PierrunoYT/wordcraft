# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/): `cargo deny check`, or
# `cargo xtask deny` (skipped with a notice when cargo-deny is not installed; part of `cargo xtask ci`).
# Install: `cargo install cargo-deny --locked`.

[graph]
# Every target the app ships on (macOS, Windows, Linux, BSD, wasm): an empty list checks them all.
targets = []
all-features = false
no-default-features = false

[advisories]
# Vulnerabilities and unsound crates always fail. Every ignore below is an *unmaintained* notice for
# a crate we cannot drop from this repository, with the reason. Revisit when the upstream moves.
ignore = [
    # rustybuzz and ttf-parser: pulled in only through `krilla` (PDF text shaping and font
    # subsetting) via `craft-pdf` from storytold/craft-libs. No safe upgrade exists; the fix is
    # upstream: craft-libs/krilla moving to harfrust and skrifa, which the rest of the tree already
    # uses. ttf-parser parses embedded document fonts during PDF export, so track it.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via krilla -> craft-pdf (craft-libs); upstream must move to harfrust" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via rustybuzz -> krilla -> craft-pdf (craft-libs); upstream must move to skrifa" },
    # zbus_names, zvariant and zvariant_derive: merged into zbus 6. Pulled in only on Linux/BSD by
    # eframe's accessibility (accesskit_unix -> atspi) and clipboard stack, which still pin zbus 5.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (eframe/accesskit_unix on Linux/BSD); fixed when eframe moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (eframe/accesskit_unix on Linux/BSD); fixed when eframe moves to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zvariant (eframe/accesskit_unix on Linux/BSD); fixed when eframe moves to zbus 6" },
]

[licenses]
# The licences the dependency tree actually uses (`cargo deny list`). Crates offering a choice (for
# example `Apache-2.0 OR GPL-2.0-only`) are taken under an allowed one; copyleft is not allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # egui's bundled UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences, not code.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
ignore = false
registries = []

[bans]
# Duplicate versions (two craft-libs revisions, vello_cpu, skrifa, read-fonts, windows-sys, ...)
# are reported but do not fail: most come from upstream crates pinning different versions.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# craft-pdf, krilla (patched), craft-ui and craft-print come from the shared craft libraries.
allow-git = ["https://github.com/storytold/craft-libs"]
